        .container {

        /* Современный стеклянный эффект для карточек */
        .glass-card {
            background: rgba(15, 20, 35, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(77, 238, 234, 0.25);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* Фото-контейнер с кинематографичным подходом */
        .photo-container {
            position: relative;
            width: 100%;
            height: 620px;
            border-radius: 36px;
            overflow: hidden;
            margin-bottom: 48px;
            box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(77, 238, 234, 0.2) inset;
            transition: transform 0.4s ease;
        }

        .photo-container:hover {
            transform: scale(1.01);
            box-shadow: 0 35px 55px -18px black;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.5s;
            filter: brightness(0.85) contrast(1.08);
        }

        .photo-container:hover .photo {
            transform: scale(1.07);
            filter: brightness(0.95) contrast(1.1);
        }

        /* Текст поверх фото - более драматично */
        .animated-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            z-index: 15;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 80%);
            padding: 1.6rem 2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,240,0.25);
        }

        .main-title {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #FFB347, #FF5E7D, #AAFFE6, #6A67CE);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientFlow 6s ease infinite, textGlow 2.2s infinite alternate;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Дополнительный безумный слоган под заголовком */
        .main-title + .badge-67 {
            display: inline-block;
            background: #ff3366cc;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            margin-top: 8px;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0.95;
            animation: pulseOpacity 2.8s infinite alternate;
            color: #eef5ff;
            text-shadow: 0 0 8px #4deeea80;
        }

        /* Ключевые кадры */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 5px rgba(255,255,200,0.4); }
            to { text-shadow: 0 0 20px rgba(255,255,210,0.9), 0 0 12px #ff5e7d; }
        }

        @keyframes pulseOpacity {
            from { opacity: 0.75; text-shadow: 0 0 0px #4deeea; }
            to { opacity: 1; text-shadow: 0 0 12px #4deeea, 0 0 4px #fff; }
        }

        /* Секция контента — карточка с кислотной обводкой */
        .content {
            padding: 40px 44px;
            margin-top: 24px;
            background: rgba(8, 12, 25, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 38px;
            border: 1px solid rgba(77, 238, 234, 0.35);
            transition: all 0.3s;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.5);
        }

        .content:hover {
            border-color: #ff5e7d;
            box-shadow: 0 25px 40px -12px rgba(255, 94, 125, 0.2);
        }

        .content h2 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(125deg, #FFD966, #FF8A5C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
            border-left: 6px solid #4deeea;
            padding-left: 24px;
        }

        .content p {
            font-size: 1.2rem;
            line-height: 1.65;
            margin-bottom: 20px;
            font-weight: 400;
            color: #eef2ffdd;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Индивидуальные иконки для абзацев — добавляем вайб */
        .content p::before {
            content: "⚡";
            font-size: 1.6rem;
            filter: drop-shadow(0 0 3px #ff5e7d);
        }

        .content p:nth-child(2)::before { content: "🐕‍🦺"; }
        .content p:nth-child(3)::before { content: "🧠"; }
        .content p:nth-child(4)::before { content: "🌳💦"; }
        .content p:nth-child(5)::before { content: "📟 6️⃣7️⃣"; }
        .content p:last-child::before { content: "👑"; }

        /* Футер с анимированной линией */
        .footer {
            text-align: center;
            padding: 32px 20px 24px;
            margin-top: 52px;
            border-top: 1px solid rgba(77, 238, 234, 0.3);
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            color: #8f9bb5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .footer p:first-child {
            font-weight: 500;
            background: linear-gradient(90deg, #ffb347, #ff5e7d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            width: fit-content;
            margin: 0 auto;
        }

        /* Дополнительный элемент — психоделический бегущий текст */
        .marquee-meme {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 60px;
            padding: 10px 0;
            margin: 20px 0 0;
            overflow: hidden;
            white-space: nowrap;
            border: 1px solid rgba(255, 94, 125, 0.5);
        }

        .marquee-meme span {
            display: inline-block;
            padding-left: 20px;
            animation: scrollText 18s linear infinite;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #ffdb7e;
            text-transform: uppercase;
        }

        @keyframes scrollText {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
